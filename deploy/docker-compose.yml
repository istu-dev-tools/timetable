name: timetable

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetable}
      POSTGRES_DB: ${POSTGRES_DB:-timetable}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  api:
    image: ghcr.io/istu-pro-dev/timetable-api:local
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-timetable}:${POSTGRES_PASSWORD:-timetable}@postgres:5432/${POSTGRES_DB:-timetable}?sslmode=disable
      # APP_ENV=dev allows running without JWT_SECRET (insecure development secret).
      # For a real deployment set APP_ENV=production and a JWT_SECRET of at least 32 bytes.
      APP_ENV: ${APP_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Nginx sets X-Forwarded-For; the API takes the client IP for login rate limiting from it.
      TRUST_PROXY: "true"
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    networks:
      - frontend
      - backend

  web:
    image: ghcr.io/istu-pro-dev/timetable-web:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - frontend

volumes:
  pgdata:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
